<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#05040a" />
    <meta name="apple-mobile-web-app-title" content="DODGE!" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Hold to survive. Don’t lift. Don’t touch the balls." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DODGE!</title>
  </head>
  <body>
    <audio id="bgm" src="./blue-danube.mp3" loop preload="auto" playsinline></audio>
    <button type="button" id="bgm-toggle" aria-label="Mute music" aria-pressed="false" title="Mute">♪</button>
    <div id="flash" aria-hidden="true"></div>
    <img id="watermark" src="/protoz-logo.png" alt="" draggable="false" />
    <canvas id="stage" aria-hidden="true"></canvas>
    <div id="atmos" aria-hidden="true"></div>
    <div id="play-frame" aria-hidden="true"></div>
    <div id="edge-tint" aria-hidden="true"></div>
    <div id="hud">
      <div id="timer-wrap">
        <p id="timer">0.0</p>
      </div>
      <p id="score-pop" class="is-hidden"></p>
      <p id="tool-toast" class="is-hidden"></p>
      <canvas id="level-up" width="1" height="1" aria-hidden="true"></canvas>
      <canvas id="countdown" width="1" height="1" aria-hidden="true"></canvas>
      <div id="legend" class="is-hidden"></div>
      <p id="review-score" class="is-hidden"></p>
      <div id="overlay">
        <p id="brand">DODGE!</p>
        <p id="challenge"></p>
        <p id="world-one"></p>
        <div id="start-links">
          <button type="button" id="how-to-open">How to play</button>
          <button type="button" id="board-open">Top 10</button>
        </div>
        <p id="banner"></p>
        <p id="tease"></p>
        <div id="share-stage" class="is-hidden">
          <figure id="share-card">
            <img id="share-card-img" alt="" />
          </figure>
        </div>
        <p id="final-score"></p>
        <p id="compare"></p>
        <p id="callout"></p>
        <p id="best"></p>
        <div id="board-strip" class="is-hidden">
          <p id="board-strip-title">Top 10</p>
          <ol id="board-rows"></ol>
          <form id="board-form" class="is-hidden">
            <input
              id="board-name"
              maxlength="12"
              placeholder="Name (optional)"
              autocomplete="nickname"
              enterkeyhint="done"
            />
            <button type="submit" id="board-submit">Post</button>
          </form>
          <p id="board-status"></p>
        </div>
        <div id="actions">
          <button type="button" id="view-path">View path</button>
          <button type="button" id="share-score">Share</button>
        </div>
        <p id="hint">Hold Your Finger to Start</p>
      </div>
      <div id="review-bar" class="is-hidden">
        <button type="button" id="review-done">Done</button>
      </div>
      <div id="how-to" class="is-hidden">
        <div id="how-to-card">
          <h2 id="how-to-title">How to play</h2>
          <ul id="how-to-list"></ul>
          <button type="button" id="how-to-close">Close</button>
        </div>
      </div>
      <div id="board" class="is-hidden">
        <div id="board-card">
          <h2 id="board-title">World Top 10</h2>
          <ol id="board-modal-rows"></ol>
          <p id="board-modal-status"></p>
          <button type="button" id="board-close">Close</button>
        </div>
      </div>
      <p id="credit">A Prototype by denyuen. All Rights Reserved.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
